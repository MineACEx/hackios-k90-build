name: build-k90-ios

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "build stage"
        required: true
        default: "kernel"
        type: choice
        options:
          - kernel
          - userland
          - all

concurrency:
  group: k90-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk
        run: |
          df -h /
          free -h
          nproc

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates tar xz-utils make clang lld llvm python3 python3-pip python-is-python3 perl flex bison m4 autoconf automake libtool pkg-config gawk file unzip zstd libzstd-dev bzip2 zip binutils uuid-dev libssl-dev libxml2-dev libbz2-dev liblzma-dev libncurses-dev device-tree-compiler p7zip-full lz4 cpio patch

      - name: Clone workspace
        run: |
          git clone --recurse-submodules https://github.com/iola1999/hackios-redmi-k90-annibale.git work
          cd work && git submodule status

      - name: Install theos + iOS toolchain
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain"
          curl -sL --fail https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz -o /tmp/iostc.tar.xz
          ls -la /tmp/iostc.tar.xz
          tar -xJf /tmp/iostc.tar.xz -C "$HOME/theos/toolchain/"
          "$HOME/theos/bin/install-sdk" iPhoneOS16.5
          rm -f /tmp/iostc.tar.xz

      - name: Verify toolchain
        run: |
          echo "=== theos ==="
          ls "$HOME/theos"
          echo "=== toolchain bin ==="
          ls "$HOME/theos/toolchain/linux/iphone/bin/" | head -20
          echo "=== sdk ==="
          ls "$HOME/theos/sdks/"
          echo "=== ld64 ==="
          "$HOME/theos/toolchain/linux/iphone/bin/ld64" --version 2>&1 | head -3

      - name: Prepare xnu tree
        working-directory: work/hackios-xnu-kernel
        run: |
          bash xnu/apply.sh
          bash xnu-deps/setup.sh

      - name: Build XNU
        if: inputs.stage == 'kernel' || inputs.stage == 'all'
        working-directory: work/hackios-xnu-kernel
        run: |
          bash xnu-build.sh -j4 BUILD_DSYM=0 KEXT_CREATE_SYMBOL_SET=/bin/true
          echo "=== output ==="
          find . -name "mach.development.bcm2837" -exec ls -la {} \;
          find . -name "mach.development.bcm2837" -exec sha256sum {} \;

      - name: Upload kernel
        if: inputs.stage == 'kernel' || inputs.stage == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mach-bcm2837
          path: work/hackios-xnu-kernel/xnu-src/**/mach.development.bcm2837
          if-no-files-found: warn
          compression-level: 0

      - name: Merge userland overlay
        if: inputs.stage == 'userland' || inputs.stage == 'all'
        working-directory: work/hackios-xnu-kernel
        env:
          USERLAND_URL: https://github.com/iola1999/hackios-xnu-userland.git
          USERLAND_REF: k90-port
        run: |
          bash common/setup.sh
          ls -la userland/build.sh

      - name: Build userland + APFS
        if: inputs.stage == 'userland' || inputs.stage == 'all'
        working-directory: work/hackios-xnu-kernel
        run: |
          bash ios165/fetch.sh
          df -h /
          bash userland/build.sh
          echo "=== apfs ==="
          find . -name "*.apfs" -exec ls -la {} \;
          find . -name "*.apfs" -exec sha256sum {} \;

      - name: Upload APFS
        if: inputs.stage == 'userland' || inputs.stage == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: userland-apfs
          path: work/hackios-xnu-kernel/userland/*.apfs
          if-no-files-found: warn
          compression-level: 0

      - name: Final state
        if: always()
        run: |
          df -h /
          du -sh work 2>/dev/null || true
          find work -name "*.apfs" -o -name "mach.development.bcm2837" 2>/dev/null | head -20
