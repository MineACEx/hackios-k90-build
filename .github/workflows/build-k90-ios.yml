name: build-k90-ios

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "build stage"
        required: true
        default: "kernel"
        type: choice
        options:
          - kernel
          - userland
          - all

concurrency:
  group: k90-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk
        run: |
          df -h /
          free -h
          nproc
          cat /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | head -20 || true

      - name: Install deps (base)
        timeout-minutes: 12
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git curl ca-certificates tar xz-utils make file unzip zip binutils patch cpio

      - name: Install deps (toolchain)
        timeout-minutes: 20
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang lld llvm python3 python3-pip python-is-python3 perl flex bison m4 autoconf automake libtool pkg-config gawk zstd libzstd-dev bzip2 uuid-dev libssl-dev libxml2-dev libbz2-dev liblzma-dev libncurses-dev device-tree-compiler p7zip-full lz4

      - name: Show toolchain versions
        run: |
          clang --version | head -2
          ld.lld --version
          python3 --version
          7z | head -3 || true

      - name: Clone workspace
        timeout-minutes: 15
        run: |
          git clone --recurse-submodules https://github.com/iola1999/hackios-redmi-k90-annibale.git work
          cd work && git submodule status
          ls -la

      - name: Install theos
        timeout-minutes: 12
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain"
          curl -sL --fail --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iostc.tar.xz
          ls -la /tmp/iostc.tar.xz
          tar -xJf /tmp/iostc.tar.xz -C "$HOME/theos/toolchain/"
          rm -f /tmp/iostc.tar.xz
          "$HOME/theos/bin/install-sdk" iPhoneOS16.5

      - name: Verify theos
        run: |
          echo "=== theos root ==="
          ls "$HOME/theos"
          echo "=== toolchain ==="
          ls "$HOME/theos/toolchain/linux/iphone/bin/" | head -20
          echo "=== sdk ==="
          ls "$HOME/theos/sdks/"
          echo "=== ld64 --version ==="
          "$HOME/theos/toolchain/linux/iphone/bin/ld64" --version 2>&1 | head -3 || echo "ld64 run failed"

      - name: Prepare xnu tree
        timeout-minutes: 25
        working-directory: work/hackios-xnu-kernel
        run: |
          bash xnu/apply.sh
          bash xnu-deps/setup.sh

      - name: Build XNU
        timeout-minutes: 120
        working-directory: work/hackios-xnu-kernel
        run: |
          bash xnu-build.sh -j4 BUILD_DSYM=0 KEXT_CREATE_SYMBOL_SET=/bin/true
          echo "=== output ==="
          find . -name "mach.development.bcm2837" -exec ls -la {} \;
          find . -name "mach.development.bcm2837" -exec sha256sum {} \;

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mach-bcm2837
          path: work/hackios-xnu-kernel/xnu-src/**/mach.development.bcm2837
          if-no-files-found: warn
          compression-level: 0