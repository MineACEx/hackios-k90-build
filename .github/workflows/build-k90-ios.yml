name: build-k90-ios

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "build stage"
        required: true
        default: "kernel"
        type: choice
        options:
          - kernel
          - userland
          - all

concurrency:
  group: k90-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          # large-packages 会连 llvm/clang 一起删掉，构建需要它们，必须关掉
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Show disk
        run: |
          df -h /
          free -h
          nproc
          cat /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null | head -20 || true

      - name: Install deps (base)
        timeout-minutes: 10
        run: |
          # runner 自带索引，先试不 update 直接装；失败才 update
          set +e
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates tar xz-utils make file unzip zip binutils patch cpio 2>&1 | tail -5
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            echo "direct install failed (rc=$rc), running apt-get update with Azure mirror"
            sudo sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g; s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources || true
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 2>&1 | tail -3
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git curl ca-certificates tar xz-utils make file unzip zip binutils patch cpio
          fi
          set -e

      - name: Install deps (toolchain, skip if present)
        timeout-minutes: 15
        run: |
          need=""
          command -v dtc >/dev/null 2>&1 || need="$need device-tree-compiler"
          command -v 7z >/dev/null 2>&1 || need="$need p7zip-full"
          command -v python3 >/dev/null 2>&1 || need="$need python3"
          command -v lz4 >/dev/null 2>&1 || need="$need lz4"
          command -v flex >/dev/null 2>&1 || need="$need flex"
          command -v bison >/dev/null 2>&1 || need="$need bison"
          dpkg -s uuid-dev >/dev/null 2>&1 || need="$need uuid-dev"
          dpkg -s libncurses-dev >/dev/null 2>&1 || need="$need libncurses-dev"
          echo "missing pkgs:$need"
          if [ -n "$need" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $need || {
              echo "install failed, retry after update"
              sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 | tail -3
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $need
            }
          else
            echo "all deps already present"
          fi
          # clang/lld: runner 预装，只确认存在
          if ! command -v clang >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang lld
          fi

      - name: Show toolchain versions
        run: |
          echo "=== clang (runner preinstalled) ==="
          clang --version | head -3
          echo "=== lld ==="
          (ld.lld --version || lld --version || echo "no lld in PATH") 2>&1 | head -3
          ls /usr/lib/llvm-*/bin/ld.lld 2>/dev/null | head -5 || true
          echo "=== python ==="
          python3 --version
          echo "=== 7z ==="
          (7z | head -3) || echo "7z missing"
          echo "=== dtc ==="
          (dtc --version || echo "dtc missing") 2>&1 | head -2

      - name: Clone workspace
        timeout-minutes: 15
        run: |
          git clone --recurse-submodules https://github.com/iola1999/hackios-redmi-k90-annibale.git work
          cd work && git submodule status
          ls -la

      - name: Install theos
        timeout-minutes: 12
        run: |
          export THEOS="$HOME/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$HOME/theos/toolchain"
          curl -sL --fail --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iostc.tar.xz
          ls -la /tmp/iostc.tar.xz
          tar -xJf /tmp/iostc.tar.xz -C "$HOME/theos/toolchain/"
          rm -f /tmp/iostc.tar.xz
          export THEOS="$HOME/theos"
          "$THEOS/bin/install-sdk" iPhoneOS16.5

      - name: Verify theos
        run: |
          echo "=== theos root ==="
          ls "$HOME/theos"
          echo "=== toolchain ==="
          ls "$HOME/theos/toolchain/linux/iphone/bin/" | head -20
          echo "=== sdk ==="
          ls "$HOME/theos/sdks/"
          echo "=== ld64 --version ==="
          "$HOME/theos/toolchain/linux/iphone/bin/ld64" --version 2>&1 | head -3 || echo "ld64 run failed"

      - name: Prepare xnu tree
        timeout-minutes: 25
        working-directory: work/hackios-xnu-kernel
        run: |
          bash xnu/apply.sh
          bash xnu-deps/setup.sh

      - name: Build XNU
        timeout-minutes: 120
        working-directory: work/hackios-xnu-kernel
        run: |
          bash xnu-build.sh -j4 BUILD_DSYM=0 KEXT_CREATE_SYMBOL_SET=/bin/true
          echo "=== output ==="
          find . -name "mach.development.bcm2837" -exec ls -la {} \;
          find . -name "mach.development.bcm2837" -exec sha256sum {} \;

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mach-bcm2837
          path: work/hackios-xnu-kernel/xnu-src/**/mach.development.bcm2837
          if-no-files-found: warn
          compression-level: 0
