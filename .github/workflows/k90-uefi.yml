name: k90-uefi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm lld gcc make uuid-dev nasm acpica-tools device-tree-compiler python3-venv gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build libssl-dev
      - name: Fetch pinned public K90 platform
        shell: bash
        run: |
          set -euo pipefail
          git init mu
          git -C mu remote add origin https://github.com/Project-Silicium/Mu-Silicium.git
          git -C mu fetch --depth 1 origin 6b3d90b79e191e08171bfedd3980234a7e49d340
          git -C mu checkout --detach FETCH_HEAD
          git init kernel
          git -C kernel remote add origin https://github.com/iola1999/hackios-xnu-kernel.git
          git -C kernel fetch --depth 1 origin dc49065f8f17c3683925270388eba128f28eab33
          git -C kernel checkout --detach FETCH_HEAD
          binary_commit=$(git -C mu ls-tree HEAD Binaries | awk '{print $3}')
          git clone --filter=blob:none --no-checkout https://github.com/Project-Silicium/Device-Binaries.git mu/Binaries
          git -C mu/Binaries sparse-checkout init --cone
          git -C mu/Binaries sparse-checkout set annibale
          git -C mu/Binaries checkout --detach "$binary_commit"
          git -C mu submodule update --init --recursive --depth 1 Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
      - name: Build public K90 UEFI with XNU handoff
        shell: bash
        run: bash scripts/build-k90-uefi.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: k90-hackios-loader
          path: output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k90-uefi-logs
          path: |
            output/uefi-build.log
            mu/Build/BUILDLOG*
            mu/Build/**/*.txt
          if-no-files-found: ignore
